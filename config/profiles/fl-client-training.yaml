profiles:
  fl-client-training:
    serviceProfile:
      title: Federated learning client
      description: |
        Prepares hospital data, trains local model weights, and evaluates
        aggregated model weights as one federated learning client.
      accessRoles:
        coordinator:
          title: Federated learning coordinator
          description: Manages client sessions, training, evaluation, and readiness checks.
        prepared-data-reader:
          title: Prepared data reader
          description: Downloads the hospital data prepared for local training.
        training-results-reader:
          title: Training results reader
          description: Reads client model weights, training metrics, and evaluation metrics.
      parameters:
        sessionId:
          predicate: session-id
          type: xsd:string
          required: true
          title: Session identifier
        clientId:
          predicate: client-id
          type: xsd:string
          required: true
          title: Client identifier
        expectedRounds:
          predicate: expected-rounds
          type: xsd:positiveInteger
          required: true
          title: Expected rounds
        trainingConfig:
          predicate: training-config
          type: xsd:string
          required: false
          title: Training configuration
        roundId:
          predicate: round-id
          type: xsd:nonNegativeInteger
          required: true
          title: Round identifier
        replyUrl:
          predicate: reply-url
          type: xsd:anyURI
          required: true
          title: Result callback URL
        globalWeights:
          predicate: global-weights
          type: xsd:base64Binary
          required: true
          title: Global model weights
      outputs:
        preparedData:
          predicate: prepared-data
          title: Prepared data
          datasetProfileRef:
            dataset: prepared-data
        clientWeights:
          predicate: client-weights
          title: Client weights
          datasetProfileRef:
            dataset: client-weights
        metrics:
          predicate: metrics
          title: Local round metrics
          datasetProfileRef:
            dataset: metrics
        metricsHistory:
          predicate: metrics-history
          title: Metrics history
          datasetProfileRef:
            dataset: metrics-history
      functions:
        prepareData:
          name: Prepare hospital data
          expects: []
          returns: [preparedData]
        train:
          name: Train local model
          expects:
            - sessionId
            - clientId
            - expectedRounds
            - trainingConfig
            - roundId
            - replyUrl
            - globalWeights
          returns: [clientWeights, metrics, metricsHistory]
        evaluate:
          name: Evaluate aggregated model
          expects:
            - sessionId
            - clientId
            - trainingConfig
            - roundId
            - replyUrl
            - globalWeights
          returns: [metrics]
      endpoints:
        session-start:
          title: Start client session
          path: /session/start
          operations:
            - method: POST
              accessRoles: [coordinator]
              updates:
                function: train
                parameters: [sessionId, clientId, expectedRounds, trainingConfig]
        session-end:
          title: End client session
          path: /session/end
          operations:
            - method: POST
              accessRoles: [coordinator]
              updates:
                function: train
                parameters: [sessionId, clientId, expectedRounds, trainingConfig]
        train:
          title: Train local model
          path: /train
          operations:
            - method: POST
              accessRoles: [coordinator]
              executes: train
              updates:
                function: train
                parameters: [roundId, replyUrl, globalWeights]
        evaluate:
          title: Evaluate global model
          path: /evaluate
          operations:
            - method: POST
              accessRoles: [coordinator]
              executes: evaluate
              updates:
                function: evaluate
                parameters: [roundId, replyUrl, globalWeights]
        status:
          title: Client status
          path: /status
          operations:
            - method: GET
              accessRoles: [coordinator]
        preparation-status:
          title: Data preparation status
          path: /preparation/status
          operations:
            - method: GET
              accessRoles: [prepared-data-reader]
    datasetProfiles:
      prepared-data:
        title: Prepared hospital data
        description: Aggregated Parquet data prepared from the hospital slices.
        distributions:
          zip:
            title: Prepared data archive
            path: /results
            urlType: downloadURL
            mediaType: application/zip
            accessRoles: [prepared-data-reader]
      client-weights:
        title: Client model weights
        distributions:
          binary:
            title: Client weights
            path: /weights
            urlType: downloadURL
            mediaType: application/octet-stream
            accessRoles: [training-results-reader]
      metrics:
        title: Local round metrics
        description: Local training and evaluation metrics for the latest round.
        distributions:
          json:
            title: Local round metrics
            path: /metrics
            urlType: accessURL
            mediaType: application/json
            accessRoles: [training-results-reader]
      metrics-history:
        title: Client metrics history
        description: Per-epoch metrics for every stored local training round.
        distributions:
          json:
            title: Metrics history
            path: /metrics/history
            urlType: accessURL
            mediaType: application/json
            accessRoles: [training-results-reader]
