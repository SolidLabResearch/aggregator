profiles:
  prepare-data:
    serviceProfile:
      title: Prepare data service
      description: | 
        Prepares data for a federated learning local client by aggregating patient accellero data.
      outputs:
        preparedData:
          predicate: prepared-data
          title: Prepared data
          datasetProfileRef:
            dataset: prepared-data
      functions:
        prepareData:
          name: Prepare data
          expects: []
          returns: [preparedData]
    datasetProfiles:
      prepared-data:
        title: Prepared data
        description: Aggregated acellero data prepared from the patients accellero data.
        distributions:
          zip:
            title: Prepared data archive
            path: /results
            urlType: downloadURL
            mediaType: application/zip