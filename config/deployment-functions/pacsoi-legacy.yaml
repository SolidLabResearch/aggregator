deploymentFunctions:
  pacsoi-legacy:
    function:
      title: Deploy legacy PACSOI service
      description: Deploys the legacy PACSOI weight and Oxford distribution workload as a fallback.
      expects:
        - name: sources
          predicate: sources
          type: xsd:anyURI
          required: true
          title: Patient source collection
        - name: weight-slice
          predicate: weight-slice
          type: xsd:string
          required: true
          title: Weight observation slice
        - name: oxford-slice
          predicate: oxford-slice
          type: xsd:string
          required: true
          title: Oxford Questionnaire Responses slice
        - name: bar-procedure-slice
          predicate: bar-procedure-slice
          type: xsd:string
          required: true
          title: Bariatric Procedure slice
        - name: knee-procedure-slice
          predicate: knee-procedure-slice
          type: xsd:string
          required: true
          title: Knee Procedure slice
      returns:
        name: deployedService
        predicate: service
        title: Deployed legacy PACSOI service
    profileRef:
      name: pacsoi-legacy
    orchestration:
      resources:
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: pacsoi-legacy
              template:
                metadata:
                  labels:
                    app: pacsoi-legacy
                spec:
                  containers:
                    - name: pacsoi-legacy
                      image: pacsoi-service-legacy
                      imagePullPolicy: Never
                      ports:
                        - name: http
                          containerPort: 3000
      inputBindings:
        - parameter: sources
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: SOURCES
        - parameter: weight-slice
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: WEIGHT_SLICE
        - parameter: oxford-slice
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: OXFORD_SLICE
        - parameter: bar-procedure-slice
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: BAR_PROCEDURE_SLICE
        - parameter: knee-procedure-slice
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: KNEE_PROCEDURE_SLICE
      routeBindings:
        distributions:
          weight-distribution:
            csv:
              resource: workload
              container: pacsoi-legacy
              port: http
              internalPath: /w-dist
          oxford-distribution:
            csv:
              resource: workload
              container: pacsoi-legacy
              port: http
              internalPath: /o-dist
