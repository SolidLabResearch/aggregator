deploymentFunctions:
  pacsoi-legacy:
    function:
      title: Deploy legacy PACSOI service
      description: Deploys the legacy PACSOI weight and Oxford distribution workload as a fallback.
      expects:
        - name: id
          predicate: id
          type: xsd:string
          required: true
          title: FAQIR doctor ID
      returns:
        name: deployedService
        predicate: service
        title: Deployed legacy PACSOI service
    profileRef:
      name: pacsoi-legacy
    orchestration:
      resources:
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: pacsoi-legacy
              template:
                metadata:
                  labels:
                    app: pacsoi-legacy
                spec:
                  containers:
                    - name: pacsoi-legacy
                      image: pacsoi-service-legacy
                      imagePullPolicy: Never
                      env:
                        - name: WEIGHT_SLICE
                          value: Read-PoC2-Weight-Observations-09
                        - name: OXFORD_SLICE
                          value: Read-PoC2-Questionnaire-Oxford-07
                        - name: BAR_PROCEDURE_SLICE
                          value: Read-PoC2-Procedure-Bariatric-09
                        - name: KNEE_PROCEDURE_SLICE
                          value: Read-PoC2-Procedure-Knee-01
                      ports:
                        - name: http
                          containerPort: 3000
      inputBindings:
        - parameter: id
          targets:
            - resource: workload
              container: pacsoi-legacy
              env: SOURCES
              valueTemplate: https://pacsoi-kvasir.faqir.org/faqir-management/slices/{{value}}-ActivePatients/query
      routeBindings:
        distributions:
          weight-distribution:
            csv:
              resource: workload
              container: pacsoi-legacy
              port: http
              internalPath: /w-dist
          oxford-distribution:
            csv:
              resource: workload
              container: pacsoi-legacy
              port: http
              internalPath: /o-dist
