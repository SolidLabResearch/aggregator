deploymentFunctions:
  pacsoi-latency:
    function:
      title: Deploy PACSOI latency service
      description: Deploys the weight-only PACSOI workload for the IG5 latency lab.
      expects:
        - name: sources
          predicate: sources
          type: xsd:string
          required: true
          title: JSON array of Kvasir pod base URLs
      returns:
        name: deployedService
        predicate: service
        title: Deployed PACSOI latency service
    interface:
      title: PACSOI latency service
      datasets:
        weight-distribution:
          title: Weight distribution
          description: Monthly aggregate patient weights relative to the bariatric procedure date.
          distributions:
            csv:
              path: /w-dist
              urlType: downloadURL
              mediaType: text/csv
    orchestration:
      resources:
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: pacsoi-latency
              template:
                metadata:
                  labels:
                    app: pacsoi-latency
                spec:
                  containers:
                    - name: pacsoi-latency
                      image: ghcr.io/ponachte/pacsoi-latency:latest
                      imagePullPolicy: Always
                      env:
                        - name: PATIENT_SLICE
                          value: pacsoi-latency
                        - name: BAR_PROCEDURE_SLICE
                          value: pacsoi-latency
                        - name: WEIGHT_SLICE
                          value: pacsoi-latency
                      ports:
                        - name: http
                          containerPort: 3000
      inputBindings:
        - parameter: sources
          targets:
            - resource: workload
              container: pacsoi-latency
              env: SOURCES
      routeBindings:
        distributions:
          weight-distribution:
            csv:
              resource: workload
              container: pacsoi-latency
              port: http
              internalPath: /w-dist
