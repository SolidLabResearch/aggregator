deploymentFunctions:
  weight-aggregation:
    function:
      title: Deploy federated weight aggregation
      description: Deploys the central federated learning coordinator.
      expects:
        - name: caseSlice
          predicate: case-slice
          type: xsd:anyURI
          required: true
          title: Researcher case slice
        - name: pollEnabled
          predicate: poll-enabled
          type: xsd:boolean
          required: true
          title: Polling enabled
        - name: pollInterval
          predicate: poll-interval
          type: xsd:string
          required: true
          title: Polling schedule
          description: Cron expression or alias such as @hourly.
      returns:
        name: deployedService
        predicate: service
        title: Deployed weight aggregation service
    profileRef:
      name: weight-aggregation
    orchestration:
      inputBindings:
        - parameter: caseSlice
          targets:
            - resource: workload
              container: weight-aggregation
              env: CASE_SLICE
        - parameter: pollEnabled
          targets:
            - resource: workload
              container: weight-aggregation
              env: POLL_ENABLED
        - parameter: pollInterval
          targets:
            - resource: workload
              container: weight-aggregation
              env: POLL_INTERVAL
      routeBindings:
        endpoints:
          session-start: &aggregation-route
            resource: workload
            container: weight-aggregation
            port: http
            internalPath: /session/start
          training-results:
            <<: *aggregation-route
            internalPath: /training-results
          evaluation-results:
            <<: *aggregation-route
            internalPath: /evaluation-results
          status:
            <<: *aggregation-route
            internalPath: /status
        distributions:
          aggregated-evaluation-metrics:
            json:
              resource: workload
              container: weight-aggregation
              port: http
              internalPath: /evaluation-metrics
      resources:
        - id: storage
          manifest:
            apiVersion: v1
            kind: PersistentVolumeClaim
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              strategy:
                type: Recreate
              selector:
                matchLabels:
                  app: weight-aggregation
              template:
                metadata:
                  labels:
                    app: weight-aggregation
                    storage-workload: "true"
                spec:
                  securityContext:
                    fsGroup: 65532
                  nodeSelector:
                    storage: local
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: DoNotSchedule
                      labelSelector:
                        matchLabels:
                          storage-workload: "true"
                  containers:
                    - name: weight-aggregation
                      image: ghcr.io/knows-aggregator/k8s-fl-services/weight-aggregation:latest
                      ports:
                        - name: http
                          containerPort: 8080
                      env:
                        - name: PORT
                          value: "8080"
                        - name: DATA_DIR
                          value: /app/data
                      readinessProbe:
                        httpGet:
                          path: /readyz
                          port: http
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      livenessProbe:
                        httpGet:
                          path: /healthz
                          port: http
                        initialDelaySeconds: 10
                        periodSeconds: 30
                      volumeMounts:
                        - name: data
                          mountPath: /app/data
                  volumes:
                    - name: data
                      persistentVolumeClaim:
                        claimName: storage
