deploymentFunctions:
  pacsoi:
    function:
      title: Deploy PACSOI service
      description: Deploys the PACSOI weight and oxford distribution workload.
      expects:
        - name: id
          predicate: id
          type: xsd:string
          required: true
          title: FAQIR doctor ID
      returns:
        name: deployedService
        predicate: service
        title: Deployed PACSOI service
    profileRef:
      name: pacsoi
    orchestration:
      resources:
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: pacsoi
              template:
                metadata:
                  labels:
                    app: pacsoi
                spec:
                  containers:
                    - name: pacsoi
                      image: pacsoi-service
                      imagePullPolicy: Never
                      env:
                        - name: PATIENT_SLICE
                          value: "TODO set patient slice"
                        - name: WEIGHT_SLICE
                          value: "TODO set weight slice"
                        - name: OXFORD_SLICE
                          value: "TODO set oxford slice"
                        - name: BAR_PROCEDURE_SLICE
                          value: "TODO set bar procedure slice"
                        - name: KNEE_PROCEDURE_SLICE
                          value: "TODO set knee procedure slice"
                      ports:
                        - name: http
                          containerPort: 3000
      inputBindings:
        - parameter: id
          targets:
            - resource: workload
              container: pacsoi
              env: SOURCES
              valueTemplate: https://pacsoi-kvasir.faqir.org/faqir-management/slices/{{value}}-ActivePatients/query
      routeBindings:
        distributions:
          weight-distribution:
            csv:
              resource: workload
              container: pacsoi
              port: http
              internalPath: /w-dist
          oxford-distribution:
            csv:
              resource: workload
              container: pacsoi
              port: http
              internalPath: /o-dist
