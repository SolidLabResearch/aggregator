deploymentFunctions:
  pacsoi:
    function:
      title: Deploy PACSOI service
      description: Deploys the PACSOI weight and bariatric questionnaire score distribution workload.
      expects:
        - name: team
          predicate: team
          type: xsd:anyURI
          required: false
          title: Team
          description: Optional team URI used to scope active-patient discovery.
      returns:
        name: deployedService
        predicate: service
        title: Deployed PACSOI service
    profileRef:
      name: pacsoi
    orchestration:
      inputBindings:
        - parameter: team
          targets:
            - resource: workload
              container: pacsoi
              env: TEAM_URI
      resources:
        - id: workload
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: pacsoi
              template:
                metadata:
                  labels:
                    app: pacsoi
                spec:
                  containers:
                    - name: pacsoi
                      image: pacsoi-service
                      imagePullPolicy: Never
                      env:
                        - name: ACTIVE_PATIENTS_URL
                          value: "https://pacsoi-services.faqir.org/hcps/active_patients"
                        - name: TEAM_ACTIVE_PATIENTS_URL
                          value: "https://pacsoi-services.faqir.org/hcps/teams/active_patients"
                        - name: ACTIVE_PATIENTS_POLL_INTERVAL_MS
                          value: "60000"
                        - name: POD_BASE_URL
                          value: "https://pacsoi-kvasir.faqir.org"
                        - name: PATIENT_SLICE
                          value: "Read-Patient"
                        - name: WEIGHT_SLICE
                          value: "Read-Weight-Observations"
                        - name: BAR_PROCEDURE_SLICE
                          value: "Read-Procedure-Bariatric"
                        - name: QUESTIONNAIRE_PREOP_SLICE
                          value: "Read-Questionnaire-Bariatric-preop"
                        - name: QUESTIONNAIRE_POSTOP6W_SLICE
                          value: "Read-Questionnaire-Bariatric-postop-6w"
                        - name: QUESTIONNAIRE_POSTOP3M_SLICE
                          value: "Read-Questionnaire-Bariatric-postop-3m"
                        - name: QUESTIONNAIRE_POSTOP6M_SLICE
                          value: "Read-Questionnaire-Bariatric-postop-6m"
                        - name: QUESTIONNAIRE_POSTOP1Y_SLICE
                          value: "Read-Questionnaire-Bariatric-postop-1y"
                      ports:
                        - name: http
                          containerPort: 3000
      routeBindings:
        distributions:
          weight-distribution:
            csv:
              resource: workload
              container: pacsoi
              port: http
              internalPath: /w-dist
          bariatric-score-distribution:
            csv:
              resource: workload
              container: pacsoi
              port: http
              internalPath: /b-dist
