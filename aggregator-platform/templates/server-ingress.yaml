apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aggregator-server-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggregator.labels" $ | nindent 4 }}
  annotations:
    {{- include "aggregator.annotations" $ | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}

  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.external.host }}
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
        
  rules:
    - host: {{ .Values.external.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aggregator-server-svc
                port:
                  name: public
