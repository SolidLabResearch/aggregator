apiVersion: v1
kind: Service
metadata:
  name: aggregator-server-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggregator.labels" $ | nindent 4 }}
  annotations:
    {{- include "aggregator.annotations" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aggregator-server
    app.kubernetes.io/component: server
  ports:
    - port: 5000
      targetPort: 5000