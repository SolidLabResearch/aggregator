{{- if .Values.auth.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: aggregator-server-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.auth.clientSecret | quote }}
---
{{- end }}
{{- if and .Values.tls.enabled (eq .Values.tls.mode "selfsigned") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.selfSigned.crt | b64enc | quote }}
  tls.key: {{ .Values.tls.selfSigned.key | b64enc | quote }}
---
{{- end }}
{{- if and .Values.tls.enabled (eq .Values.tls.mode "cert-manager") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.secretName }}
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.secretName }}
  dnsNames:
    {{- if .Values.tls.certManager.dnsNames }}
    {{- range .Values.tls.certManager.dnsNames }}
    - {{ . }}
    {{- end }}
    {{- else }}
    - {{ .Values.host }}
    {{- end }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuerName }}
    kind: {{ default "ClusterIssuer" .Values.tls.certManager.issuerKind }}
    group: {{ default "cert-manager.io" .Values.tls.certManager.issuerGroup }}
  {{- if .Values.tls.certManager.duration }}
  duration: {{ .Values.tls.certManager.duration }}
  {{- end }}
  {{- if .Values.tls.certManager.renewBefore }}
  renewBefore: {{ .Values.tls.certManager.renewBefore }}
  {{- end }}
---
{{- end }}