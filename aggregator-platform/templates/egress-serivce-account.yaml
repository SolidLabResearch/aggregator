apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-uma-sa
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-uma-configmap-editor
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-uma-configmap-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: egress-uma-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: egress-uma-configmap-editor
  apiGroup: rbac.authorization.k8s.io
