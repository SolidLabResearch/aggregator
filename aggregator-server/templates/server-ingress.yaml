apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aggregator-server-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aggregator.labels" $ | nindent 4 }}
  annotations:
    {{- include "aggregator.annotations" $ | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}      
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aggregator-server-svc
                port:
                  number: 5000
