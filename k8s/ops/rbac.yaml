apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregator-cleaner-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get","list","watch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aggregator-cleaner-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aggregator-cleaner-role
subjects:
  - kind: ServiceAccount
    name: aggregator-cleaner
    namespace: aggregator-ops
