apiVersion: agg.idlab.ugent.be/v1
kind: Transformation
metadata:
  name: calculate-weight-distribution
  namespace: aggregator-app
spec:
  id: "CalculateWeightDistribution"
  image: "comunica"
  fno: |
    @prefix fno: <https://w3id.org/function/ontology#> .
    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
    @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .

    <CalculateWeightDistribution>
      a fno:Function ;
      fno:expects ( <Sources> <Query> ) ;
      fno:returns ( <WeightDistribution> ) .

    <Sources>
      a fno:Parameter ;
      fno:predicate <sources> ;
      fno:type xsd:string ;
      fno:required "true"^^xsd:boolean .
    
    <Query>
      a fno:Parameter ;
      fno:predicate <query> ;
      fno:type xsd:string ;
      fno:required "true"^^xsd:boolean .

    <WeightDistribution>
      a fno:Output ;
      fno:predicate <weightDistribution> .
  inputMapping:
    sources: SOURCES
    query: QUERY
  outputMapping:
    weightDistribution:
      port: 8080
      path: "/"
---
apiVersion: agg.idlab.ugent.be/v1
kind: Transformation
metadata:
  name: get
  namespace: aggregator-app
spec:
  id: "Get"
  image: "fetch"
  fno: |
    @prefix fno: <https://w3id.org/function/ontology#> .
    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
    @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .

    <Get>
      a fno:Function ;
      fno:expects ( <URL> ) ;
      fno:returns ( <Response> ) .

    <URL>
      a fno:Parameter ;
      fno:predicate <url> ;
      fno:type xsd:string ;
      fno:required "true"^^xsd:boolean .

    <Response>
      a fno:Output ;
      fno:predicate <resp> .
  inputMapping:
    url: GET_URL
  outputMapping:
    resp:
      port: 8080
      path: "/"